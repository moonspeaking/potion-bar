<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Призрачный Бар — веб-порт</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0614;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{box-shadow:0 0 48px rgba(0,0,0,.9);cursor:default;touch-action:none;display:block}
  #fs{position:fixed;top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));z-index:5;
    width:34px;height:34px;border:0;border-radius:8px;background:rgba(20,10,32,.55);color:#f0e6ff;font:20px/34px sans-serif;
    padding:0;cursor:pointer;opacity:.55}
  #fs:hover{opacity:1}
  #rotate{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#0b0614;color:#f0e6ff;font:20px Georgia,serif;text-align:center;padding:24px}
  #rotate i{font-style:normal;font-size:64px;display:block;margin-bottom:12px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1024" height="768"></canvas></div>
<button id="fs" type="button" title="Полный экран" aria-label="Полный экран">⤢</button>
<div id="rotate"><div><i>📱</i>Поверните устройство горизонтально</div></div>
